<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Movie Generator</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        /* Fade-in animation for the movie card */
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Glassmorphism utility */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen text-white flex items-center justify-center p-4">

    <main class="glass-card rounded-3xl shadow-2xl p-8 max-w-lg w-full relative overflow-hidden transition-all duration-300">
        
        <!-- Decorative background elements -->
        <div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 rounded-full bg-pink-500 opacity-20 blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-40 h-40 rounded-full bg-teal-500 opacity-20 blur-3xl"></div>

        <!-- Header -->
        <div class="text-center relative z-10 mb-8">
            <h1 class="text-4xl font-extrabold mb-2 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-teal-300 to-cyan-400">
                Random Movie<br>Generator
            </h1>
            <p class="text-gray-300 text-sm">Bosan? Cari tahu film apa yang harus kamu tonton selanjutnya!</p>
        </div>

        <!-- Movie Details Container (Initially Hidden) -->
        <div id="movie-container" class="hidden relative z-10 mb-8">
            <div class="text-center">
                <h2 id="movie-title" class="text-3xl font-bold mb-3 leading-tight">Movie Title</h2>
                
                <div class="flex flex-wrap justify-center gap-2 mb-4">
                    <span id="movie-year" class="bg-indigo-600/60 text-indigo-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wide border border-indigo-500/50">
                        2023
                    </span>
                    <span id="movie-genre" class="bg-pink-600/60 text-pink-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wide border border-pink-500/50">
                        Sci-Fi
                    </span>
                </div>
                
                <div class="bg-black/30 rounded-2xl p-5 border border-white/5">
                    <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2 text-left">Synopsis</h3>
                    <p id="movie-synopsis" class="text-gray-200 text-sm leading-relaxed text-left">
                        Movie synopsis goes here.
                    </p>
                </div>
            </div>
        </div>

        <!-- Placeholder Empty State -->
        <div id="empty-state" class="text-center relative z-10 mb-8 py-8 border-2 border-dashed border-white/20 rounded-2xl">
            <span class="text-4xl block mb-2">🍿</span>
            <p class="text-gray-400 text-sm">Klik tombol di bawah untuk mendapatkan rekomendasi.</p>
        </div>

        <!-- Action Button -->
        <button id="generate-btn" class="relative z-10 w-full bg-gradient-to-r from-pink-500 to-orange-400 hover:from-pink-600 hover:to-orange-500 text-white font-bold py-4 px-6 rounded-xl transition-all transform hover:scale-[1.02] hover:shadow-lg hover:shadow-pink-500/30 active:scale-95 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
            </svg>
            Get a Random Movie
        </button>

    </main>

    <script>
        // Array containing a diverse list of movies (including Indonesian hits)
        const movies = [
            {
                title: "The Raid: Redemption",
                year: "2011",
                genre: "Action / Martial Arts",
                synopsis: "Pasukan khusus elit terperangkap dalam sebuah gedung apartemen bertingkat tinggi yang dikuasai oleh gembong narkoba yang kejam dan pasukan pembunuhnya. Mereka harus berjuang melewati setiap lantai untuk bertahan hidup."
            },
            {
                title: "Ada Apa dengan Cinta?",
                year: "2002",
                genre: "Romance / Drama",
                synopsis: "Cinta, seorang gadis SMA yang populer, hidupnya berubah ketika ia bertemu dengan Rangga, seorang siswa penyendiri yang mencintai puisi. Kisah cinta klasik remaja Indonesia."
            },
            {
                title: "Inception",
                year: "2010",
                genre: "Sci-Fi / Action",
                synopsis: "A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea into the mind of a C.E.O."
            },
            {
                title: "Pengabdi Setan",
                year: "2017",
                genre: "Horror / Thriller",
                synopsis: "Setelah ibunya meninggal karena penyakit misterius yang berlangsung selama 3 tahun, seorang gadis dan keluarganya mulai mengalami teror mencekam di rumah mereka sendiri."
            },
            {
                title: "La La Land",
                year: "2016",
                genre: "Romance / Musical",
                synopsis: "While navigating their careers in Los Angeles, a pianist and an actress fall in love while attempting to reconcile their aspirations for the future."
            },
            {
                title: "Laskar Pelangi",
                year: "2008",
                genre: "Drama",
                synopsis: "Kisah inspiratif tentang sepuluh anak sekolah dari keluarga miskin di Pulau Belitung yang berjuang untuk mendapatkan pendidikan di tengah keterbatasan."
            },
            {
                title: "Interstellar",
                year: "2014",
                genre: "Sci-Fi / Adventure",
                synopsis: "When Earth becomes uninhabitable in the future, a farmer and ex-NASA pilot, Joseph Cooper, is tasked to pilot a spacecraft, along with a team of researchers, to find a new planet for humans."
            },
            {
                title: "Mad Max: Fury Road",
                year: "2015",
                genre: "Action / Sci-Fi",
                synopsis: "In a post-apocalyptic wasteland, a woman rebels against a tyrannical ruler in search for her homeland with the aid of a group of female prisoners, a psychotic worshiper, and a drifter named Max."
            },
            {
                title: "Parasite",
                year: "2019",
                genre: "Thriller / Dark Comedy",
                synopsis: "Greed and class discrimination threaten the newly formed symbiotic relationship between the wealthy Park family and the destitute Kim clan."
            },
            {
                title: "Spirited Away",
                year: "2001",
                genre: "Animation / Fantasy",
                synopsis: "During her family's move to the suburbs, a sullen 10-year-old girl wanders into a world ruled by gods, witches, and spirits, and where humans are changed into beasts."
            },
            {
                title: "Gundala",
                year: "2019",
                genre: "Action / Superhero",
                synopsis: "Sancaka telah hidup di jalanan sejak orang tuanya meninggalkannya. Saat kota semakin tidak aman, ia harus memutuskan apakah akan terus bersembunyi atau bangkit menjadi pahlawan yang tertindas."
            },
            {
                title: "Pride & Prejudice",
                year: "2005",
                genre: "Romance / Drama",
                synopsis: "Sparks fly when spirited Elizabeth Bennet meets single, rich, and proud Mr. Darcy. But Mr. Darcy reluctantly finds himself falling in love with a woman beneath his class."
            },
            {
                title: "The Matrix",
                year: "1999",
                genre: "Sci-Fi / Action",
                synopsis: "When a beautiful stranger leads computer hacker Neo to a forbidding underworld, he discovers the shocking truth—the life he knows is the elaborate deception of an evil cyber-intelligence."
            },
            {
                title: "Marlina si Pembunuh dalam Empat Babak",
                year: "2017",
                genre: "Thriller / Drama",
                synopsis: "Kisah seorang janda asal Sumba yang memenggal kepala perampok yang menyerangnya, lalu melakukan perjalanan mencari keadilan dengan membawa kepala sang perampok."
            },
            {
                title: "The Dark Knight",
                year: "2008",
                genre: "Action / Crime",
                synopsis: "When the menace known as the Joker wreaks havoc and chaos on the people of Gotham, Batman must accept one of the greatest psychological and physical tests of his ability to fight injustice."
            }
        ];

        // DOM Elements
        const generateBtn = document.getElementById('generate-btn');
        const movieContainer = document.getElementById('movie-container');
        const emptyState = document.getElementById('empty-state');
        const movieTitle = document.getElementById('movie-title');
        const movieYear = document.getElementById('movie-year');
        const movieGenre = document.getElementById('movie-genre');
        const movieSynopsis = document.getElementById('movie-synopsis');

        // Variable to store the last picked index to avoid immediate repeats
        let lastPickedIndex = -1;

        // Function to handle the generation of a random movie
        generateBtn.addEventListener('click', () => {
            // Pick a random movie, ensuring it's not the same as the last one
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * movies.length);
            } while (randomIndex === lastPickedIndex && movies.length > 1);
            
            lastPickedIndex = randomIndex;
            const selectedMovie = movies[randomIndex];

            // Hide empty state if it's visible
            emptyState.style.display = 'none';

            // Remove animation class to reset it
            movieContainer.classList.remove('fade-in');
            
            // Force a reflow to restart animation (magic trick for CSS animations)
            void movieContainer.offsetWidth; 

            // Update DOM with new movie details
            movieTitle.textContent = selectedMovie.title;
            movieYear.textContent = selectedMovie.year;
            movieGenre.textContent = selectedMovie.genre;
            movieSynopsis.textContent = selectedMovie.synopsis;

            // Show container and apply animation
            movieContainer.classList.remove('hidden');
            movieContainer.classList.add('fade-in');

            // Button feedback (temporary text change)
            const originalHTML = generateBtn.innerHTML;
            generateBtn.innerHTML = '✨ Generated!';
            setTimeout(() => {
                generateBtn.innerHTML = originalHTML;
            }, 800);
        });
    </script>
</body>
</html>
